<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 - Christmas edition</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/dialogs.css">
  <script src="js/app.js" defer></script>
  <script src="js/swipe.js" defer></script>
</head>

<body>
  <main class="game">
    <header class="game-header">
      <div class="brand">
        <p class="edition" lang="en">
          <span aria-hidden="true">✳</span>
          Christmas edition
        </p>
        <h1>2048</h1>
      </div>

      <div class="scores" aria-label="Очки">
        <div class="score-card">
          <span class="score-label">Счёт</span>
          <span class="score-value" id="score">0</span>
        </div>

        <div class="score-card score-card-best">
          <span class="score-label">Рекорд</span>
          <span class="score-value" id="best-score">0</span>
        </div>
      </div>
    </header>

    <div class="toolbar" role="group" aria-label="Действия игры">
      <button class="button button-primary" id="restart-button"
              type="button">
        Новая игра
      </button>

      <button class="button" id="undo-button"
              type="button" disabled>
        Отменить ход
      </button>

      <button class="button" id="leaders-button"
              type="button">
        Рекорды
      </button>
    </div>

    <section class="board-section" aria-label="Игровое поле">
      <div class="board" id="board"
           role="group" aria-label="Поле 4 на 4"></div>
    </section>

    <footer class="game-footer">
      <span lang="en">A little winter challenge</span>
      <span aria-hidden="true">✳</span>
    </footer>
  </main>

  <dialog class="game-dialog" id="game-over-dialog"
          aria-labelledby="game-over-title">
    <p class="dialog-eyebrow" lang="en">One more try?</p>
    <h2 id="game-over-title">Ходов больше нет</h2>
    <p class="dialog-description">Твой результат</p>
    <p class="final-score" id="final-score">0</p>

    <form class="record-form" id="record-form">
      <label class="record-label" for="player-name">
        Имя для таблицы рекордов
      </label>
      <input
        id="player-name"
        name="playerName"
        type="text"
        placeholder="Как тебя записать?"
        maxlength="24"
        required
      >
      <button class="button button-primary" type="submit">
        Сохранить результат
      </button>
    </form>

    <p class="record-message" id="record-message"
       role="status" hidden></p>

    <div class="dialog-actions">
      <button class="button" id="game-over-leaders" type="button">
        Рекорды
      </button>
      <button class="button button-primary"
              id="game-over-restart" type="button">
        Начать заново
      </button>
    </div>
  </dialog>

  <dialog class="game-dialog" id="leaders-dialog"
          aria-labelledby="leaders-title">
    <div class="dialog-header">
      <div>
        <p class="dialog-eyebrow" lang="en">Top 10</p>
        <h2 id="leaders-title">Рекорды</h2>
      </div>
      <button class="dialog-close" id="close-leaders"
        type="button" aria-label="Закрыть рекорды">
      </button>
    </div>

    <p class="dialog-description" id="leaders-empty">
      Здесь появятся твои сохранённые результаты.
    </p>

    <div class="table-wrapper" id="leaders-table-wrapper" hidden>
      <table class="leaders-table">
        <caption class="visually-hidden">
          Десять лучших сохранённых результатов
        </caption>
        <thead>
          <tr>
            <th scope="col">Имя</th>
            <th scope="col">Очки</th>
            <th scope="col">Дата</th>
          </tr>
        </thead>
        <tbody id="leaders-body"></tbody>
      </table>
    </div>
  </dialog>
</body>
</html>
